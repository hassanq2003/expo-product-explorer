name: Expo CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check Expo project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: Check TypeScript
        run: npx tsc --noEmit
